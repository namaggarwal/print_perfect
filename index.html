<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrintPerfect — Browser-Based Photo-to-Print Designer</title>
    <meta name="description" content="Resize, crop and prepare photos for physical printing entirely in your browser. Photos stay on your device with 100% privacy." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0d14" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed', err);
          });
        });
      }
    </script>
  </body>
</html>
